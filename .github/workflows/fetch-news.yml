name: Daily news refresh

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch: {}   # also runnable manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch news
        run: python scripts/fetch_news.py

      - name: Commit news.json if changed
        run: |
          if [[ -n "$(git status --porcelain news.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "chore: refresh news $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No changes to news.json."
          fi
